services:
  - type: worker
    name: creatormind-worker
    env: node
    buildCommand: npm install
    startCommand: npm run agent:worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENCLAW_SERVICE_TOKEN
        value: "30DD97A91E181237D3AA8A2D97ED98577EF355666F1366400CD370F72750CEB9"
      - key: OPENCLAW_WORKER_ID
        value: "openclaw-render-worker-1"
      - key: OPENCLAW_POLL_INTERVAL_MS
        value: "10000"
      - key: MINDS_BUILDER_API_KEY
        sync: false
      - key: MINDS_MIND_ID
        sync: false
